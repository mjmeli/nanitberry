services:
  sync:
    build: .
    container_name: nanit-huckleberry-sync
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    env_file: .env
    environment:
      STATE_DIR: /data
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}:/data
